{% extends 'blog/base.html' %}
{% block content %}

<style>
    body {
        background: #121212 !important;
        color: #ffffff !important;
        font-family: 'Poppins', sans-serif;
    }

    .card {
        background: #1b1b1b;
        border: 1px solid #2a2a2a;
        border-radius: 12px;
        padding: 40px;
        box-shadow: 0 0 20px rgba(0,0,0,0.45);
        color: #ffffff !important;
    }

    h2, label, p {
        color: #ffffff !important;
    }

    .form-control {
        background: #2a2a2a;
        border: 1px solid #3a3a3a;
        color: #ffffff;
        height: 46px;
    }

    .form-control:focus {
        background: #323232;
        border-color: #c49b66;
        color: #ffffff;
        box-shadow: 0 0 6px rgba(196,155,102,0.4);
    }

    ::placeholder {
        color: #b3b3b3;
    }

    .btn-dark-gold {
        background: #c49b66;
        color: #121212;
        border: none;
        height: 48px;
        border-radius: 8px;
        font-weight: 600;
    }

    .btn-dark-gold:hover {
        background: #b5884e;
    }

    a {
        color: #d9b682 !important;
    }

    a:hover {
        color: #e7cc9c !important;
    }
</style>

<div class="container py-5">
    <div class="row">
        <div class="col-md-6 offset-md-3 mt-5">

            <div class="card">

                <form method="post">
                    {% csrf_token %}

                    <div class="text-center mb-4">
                        <h2 class="fw-bold">Create an Account</h2>
                        <p class="text-muted" style="color:#d0d0d0 !important;">Join our community</p>
                    </div>

                    <div class="mb-3">
                        <input type="text" class="form-control" name="uname" placeholder="Your Name" required>
                    </div>

                    <div class="mb-3">
                        <input type="email" class="form-control" name="uemail" placeholder="Your Email" required>
                    </div>

                    <div class="mb-3">
                        <input type="password" class="form-control" name="upassword" placeholder="Password" required>
                    </div>

                    <button type="submit" class="btn btn-dark-gold w-100">Sign Up</button>

                    <p class="text-center mt-4" style="color:#d9d9d9;">
                        Already have an account?
                        <a href="login">Login here</a>
                    </p>

                </form>

            </div>
        </div>
    </div>
</div>

{% endblock %}

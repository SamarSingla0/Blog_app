{% extends 'blog/base.html' %}
{% block content %}
{% load static %}

<style>

/* FULL PAGE DARK BACKGROUND */
body, html {
    background-color: #121212 !important;
    margin: 0;
    padding: 0;
}

/* Container */
.custom-container {
    background-color: #121212 !important;
    color: #e5e5e5 !important;
    min-height: 100vh;
    padding-top: 20px;
    padding-bottom: 40px;
}

/* NAVBAR */
.navbar {
    background-color: #1e1e1e !important;
    border-radius: 10px;
    padding: 10px 20px;
    width: 100%;
}

/* Invert toggler icon for dark mode */
.navbar-light .navbar-toggler-icon {
    filter: invert(100%);
}

/* Push Profile Button to Right */
.navbar .form-inline {
    margin-left: auto !important;
}

/* PROFILE BUTTON */
.btn-outline-primary {
    border: 1px solid #555 !important;
    background-color: #272727 !important;
    color: #e5e5e5 !important;
}

.btn-outline-primary:hover {
    background-color: #333 !important;
    color: white !important;
    border-color: #777 !important;
}

/* DROPDOWN */
.dropdown-menu {
    min-width: 120px !important;
    padding: 5px 0 !important;

    /* preserve your dark theme */
    background-color: #1e1e1e !important;
    border: 1px solid #444 !important;
}

/* Smaller dropdown items — theme preserved */
.dropdown-item {
    padding: 6px 12px !important;
    font-size: 14px !important;

    /* preserve text + hover colors */
    color: #e5e5e5 !important;
}

.dropdown-item:hover {
    background-color: #333 !important;
}

/* TEXT COLORS */
h1, h3, label {
    color: #ffffff !important;
}

/* INPUT FIELDS DARK MODE */
.form-control {
    background-color: #1b1b1b !important;
    border: 1px solid #333 !important;
    color: #f1f1f1 !important;
}

.form-control:focus {
    background-color: #1f1f1f !important;
    border-color: #777 !important;
    color: #fff !important;
    box-shadow: none !important;
}

/* SUBMIT BUTTON */
.btn-primary {
    background-color: #ffdd88 !important;
    color: #000 !important;
    border: none !important;
    padding: 10px 25px;
    font-weight: bold;
    border-radius: 8px;
}

.btn-primary:hover {
    background-color: #e6c676 !important;
}

</style>


<div class="container custom-container">
    <nav class="navbar navbar-expand-lg navbar-light w-100">
        <button class="navbar-toggler" type="button" data-toggle="collapse"
            data-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
            aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav mr-auto">
                <li>
                    <a href="/home">
                        <img class="w-50" src="{% static 'image/pho.png' %}" alt="">
                    </a>
                </li>
            </ul>

            <!-- RIGHT SIDE PROFILE BUTTON -->
            <form class="form-inline my-2 my-lg-0">
                <div class="dropdown">
                    <button class="btn btn-outline-primary dropdown-toggle" type="button"
                        id="dropdownMenuButton" data-toggle="dropdown" aria-haspopup="true"
                        aria-expanded="false">
                        Profile
                    </button>
                    <div class="dropdown-menu" aria-labelledby="dropdownMenuButton">
                        <a class="dropdown-item" href="/newpost">New Post</a>
                        <a class="dropdown-item" href="/mypost">My Posts</a>
                        <a class="dropdown-item" href="/signout">Sign Out</a>
                    </div>
                </div>
            </form>

        </div>
    </nav>

    <form method="post">
        {% csrf_token %}

        <div class="container custom-container" style="max-width: 1250px;">
            <br><br>
            <h1 class="fw-bolder">Make a new post.</h1>
            <hr><br>

            <div class="mb-3">
                <h3><label for="exampleInputText" class="form-label">Heading/Title</label></h3>
                <input type="text" class="form-control" id="exampleInputText" name="title">
            </div>

            <div class="form-group">
                <h3><label for="exampleFormControlTextarea3">Content</label></h3>
                <textarea class="form-control" id="exampleFormControlTextarea3" rows="7" name="content"></textarea>
            </div>

            <input class="btn btn-primary" type="submit" value="Submit">
        </div>

    </form>
</div>

{% endblock %}

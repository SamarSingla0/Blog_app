{% extends 'blog/base.html' %}
{% block content %}
{% load static %}

<style>
    body {
        background: #121212 !important;
        color: #ffffff !important;
        font-family: 'Poppins', sans-serif;
    }

    .card {
        background: #1b1b1b;
        border: 1px solid #2a2a2a;
        border-radius: 12px;
        padding: 25px !important;     /* reduced padding */
        box-shadow: 0 0 20px rgba(0,0,0,0.45);
        color: #ffffff !important;
        max-width: 380px;              /* reduced width */
        margin: auto;                  /* center */
    }

    .form-control {
        background: #2a2a2a;
        border: 1px solid #3a3a3a;
        color: white;
        height: 42px;                  /* slightly smaller */
    }

    .form-control:focus {
        background: #323232;
        border-color: #c49b66;
        color: #ffffff;
        box-shadow: 0 0 6px rgba(196,155,102,0.4);
    }

    ::placeholder {
        color: #b3b3b3;
    }

    h2, label, p {
        color: #ffffff !important;
    }

    .btn-dark-gold {
        background: #c49b66;
        color: #121212;
        border: none;
        height: 45px;
        border-radius: 8px;
        font-weight: 600;
        transition: 0.2s;
    }

    .btn-dark-gold:hover {
        background: #b5884e;
    }

    a {
        color: #d9b682 !important;
        text-decoration: none;
        font-weight: 600;
    }

    a:hover {
        color: #e7cc9c !important;
    }

    .profile-image-pic {
        border: 3px solid #c49b66;
        padding: 4px;
        background: #1b1b1b;
        width: 140px !important;       /* reduced size */
    }

</style>

<div class="container py-5 d-flex justify-content-center">
    <div class="row w-100">
        <div class="col-md-4 offset-md-4 mt-5">  <!-- reduced width -->

            <div class="card my-4">

                <form method="post" class="card-body p-3">
                    {% csrf_token %}

                    <div class="text-center">
                        <img src="{% static 'image/logo.png' %}" 
                             class="img-fluid profile-image-pic img-thumbnail rounded-circle my-3"
                             alt="profile">
                    </div>

                    <div class="mb-3">
                        <input type="text" class="form-control" name="uname" placeholder="Name" required>
                    </div>

                    <div class="mb-3">
                        <input type="password" class="form-control" name="upassword" placeholder="Password" required>
                    </div>

                    <button type="submit" class="btn btn-dark-gold w-100 mb-3">Login</button>

                    <p class="text-center mt-3" style="color:#d9d9d9;">
                        Not registered?
                        <a href="/">Create an Account</a>
                    </p>

                </form>

            </div>

        </div>
    </div>
</div>

{% endblock %}
